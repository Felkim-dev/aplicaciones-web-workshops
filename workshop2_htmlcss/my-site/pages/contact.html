<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contact Form</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    
    <body>
        <header>
        <h1>Contact</h1>
        <p>Contact form</p>
        </header>
        <nav class="indice-tarjetas">
            <a href="../index.html"> Home</a>
            <a href="courses.html"> Courses</a>
            <a href="schedule.html"> Schedule</a>
            <a href="hobbies.html"> Hobbies</a>
            <a href="yachay.html"> Yachay</a>
            <a href="contact.html"> Contact</a>
        </nav>

        <form>
            <label for="Name">Name</label>
            <input type="text" id="Name" name="Name">
            <br>
            <label for="Email">Email Address</label>
            <input type="email" id="Email" name="Email">
            <br>
            <label for="Birth">Birth Date</label>
            <input type="date" id="Birth" name="Birth">
            <br>
            <label for="Degree">Degree</label>
            <select id="Degree" name="Degree">
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Biotechnology Engineering</option>
                <option>Chemistry</option>
                <option>Physics</option>
                <option>Earth Sciences</option>
                <option>Software Engineering</option>
                <option>Renewable Energy</option>
                <option>Geology</option>
                <option>Other</option>
            </select>
            <br>
            <label for="Semester">Semester</label>
            <select id="Semester" name="Semester">
                <option>First</option>
                <option>Second</option>
                <option>Third</option>
                <option>Fourth</option>
                <option>Fifth</option>
                <option>Sixth</option>
                <option>Seventh</option>
                <option>Eighth</option>
                <option>Ninth</option>
                <option>Tenth</option>
            </select>
            <br>
            <label for="Reason">Reason</label>
            <select id="Reason" name="Reason">
                <option>General Inquiry</option>
                <option>Academic Collaboration</option>
                <option>Project Feedback</option>
                <option>Other</option>
            </select>
            <br>
            <label for="Message">Message</label>
            <textarea id="Message" name="Message"></textarea>
            <br>
            <label for="Checkbox">I agree that this information may be used to respond to my inquiry </label>
            <input type="checkbox" id="Checkbox" name="Checkbox">
            <br>
            <input type="submit" value="Send Message" id="Submit" name="Submit">
        </form>
    </body>
</html>
