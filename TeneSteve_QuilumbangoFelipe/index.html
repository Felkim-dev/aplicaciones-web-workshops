<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Tourism | Workshop 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =====================================================
       PERSON 1: Navbar + Hero
       (HTML/CSS for this section + JS for the color toggle)
       ===================================================== -->

  <nav class="navbar">
    <div class="navbar-brand">AstroTours</div>
    <ul class="navbar-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#destinations">Destinations</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#booking">Booking</a></li>
    </ul>
  </nav>

  <section id="hero">
    <h1>Your next getaway... 400 km up</h1>
    <p>Book your trip to the Moon, Mars, or the International Space Station.</p>
    <button id="btn-hero">Book now</button>
  </section>

  <!-- =====================================================
       PERSON 2: Gallery + Form
       (HTML/CSS for this section + JS for the modal and validation)
       ===================================================== -->

  <section id="destinations">
    <h2>Destinations</h2>
    <p>Choose your next out-of-this-world destination.</p>
  </section>

  <section id="gallery" class="gallery">
    <img class="gallery-img" src="Gallery/moon.jpg" alt="Moon">
    <img class="gallery-img" src="Gallery/marte.webp" alt="Mars">
    <img class="gallery-img" src="Gallery/space-station.webp" alt="Space Station">
    <img class="gallery-img" src="Gallery/earth.jpg" alt="Earth from space">
  </section>

  <!-- Modal for the enlarged image (used by script.js) -->
  <div id="image-modal" class="modal">
    <span id="modal-close" class="modal-close">&times;</span>
    <img id="modal-img" class="modal-content">
  </div>

  <section id="booking">
    <h2>Book your trip</h2>
    <form id="contact-form">
      <label for="input-name">Name</label>
      <input type="text" id="input-name" name="name">

      <label for="input-email">Email</label>
      <input type="email" id="input-email" name="email">

      <label for="input-message">Message</label>
      <textarea id="input-message" name="message"></textarea>

      <button type="submit" id="btn-submit">Submit</button>
    </form>
  </section>

  <!-- ===== End of marked sections ===== -->

  <!-- jQuery (latest version via CDN) -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
